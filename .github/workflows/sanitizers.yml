name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first, so a force-push or a quick follow-up
# commit does not leave a full 20-job matrix running against a commit nobody
# will look at. Only pull_request runs are cancelled: a push to main or a tag
# must finish, because its result is what the branch protection and the release
# read.
# Least privilege for every job that does not say otherwise: checkout needs to
# read the repository, and artifacts and caches use the runner's own token,
# not GITHUB_TOKEN. A job-level block replaces this one entirely, which is how
# the jobs that publish get more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so every job links the same libpqxx, built statically from source,
  # instead of whatever each distro happens to package. Named once here because
  # it is also part of the build cache key.
  PQXX_VERSION: 8.0.2

jobs:
  # Compile each distinct configuration once and hand the binary to the jobs
  # that run it.
  #
  # There are three configurations and twenty test jobs: valgrind and pooled
  # both want the plain RelWithDebInfo build, and the five PostgreSQL majors of
  # each differ only in the server they talk to, not in the binary. Compiling
  # per test job spent roughly 40 minutes of runner time re-deriving three
  # binaries. libpqxx is linked statically (BUILD_SHARED_LIBS=OFF), so the
  # artifact needs nothing at run time beyond libpq.
  build:
    name: build-${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: plain
            sanitizer: NONE
          - config: address-undefined
            sanitizer: ADDRESS_UNDEFINED
          - config: thread
            sanitizer: THREAD
          # A second front end: clang's diagnostics differ from g++'s, and
          # SafetyFlags.cmake builds with -Werror, so a warning only clang
          # raises fails here. It builds its own libpqxx too, and caches it
          # separately: its first run failed at link because clang mangles
          # constrained templates differently from the g++-built library it was
          # handed. Not on the critical path. Build-only: no downstream job
          # consumes its binary, so it is not uploaded.
          - config: plain-clang
            sanitizer: NONE
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # mandoc is only needed for the manpage_lint ctest; the build itself
          # has no doc-toolchain dependency, since the man page is checked in.
          .github/scripts/apt-pgdg.sh cmake libpq-dev nlohmann-json3-dev \
                                      libgtest-dev pkg-config mandoc
          # Part of the libpqxx cache key: libpqxx compiles against these
          # headers, so a libpq upgrade must not reuse an object built before it.
          echo "LIBPQ_VERSION=$(dpkg-query -W -f='${Version}' libpq-dev)" >> "$GITHUB_ENV"

      # Installed to a prefix under $HOME rather than /usr/local so it can be
      # cached: the generated libpqxx.pc bakes in its prefix, so the restore
      # path has to match the install path exactly.
      - name: Cache libpqxx
        id: pqxx
        uses: actions/cache@v4
        with:
          path: ~/pqxx
          # The compiler is part of the key: clang and g++ mangle constrained
          # templates differently, so clang code cannot link a g++-built
          # libpqxx (undefined pqxx::internal::to_string_float<...> at link).
          key: pqxx-${{ env.PQXX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-libpq-${{ env.LIBPQ_VERSION }}-${{ matrix.cxx || 'gcc' }}

      - name: Build libpqxx
        if: steps.pqxx.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          # Built by the same compiler as pg_licht, for the reason in the key.
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/pqxx" \
            ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
          cmake --build /tmp/libpqxx-build
          cmake --install /tmp/libpqxx-build

      - name: Configure and build
        run: |
          # lib64 as well as lib: CMake picks the directory, not this workflow.
          echo "PKG_CONFIG_PATH=$HOME/pqxx/lib/pkgconfig:$HOME/pqxx/lib64/pkgconfig" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="$HOME/pqxx/lib/pkgconfig:$HOME/pqxx/lib64/pkgconfig"
          # Only plain-clang names a compiler; the others keep CMake's default.
          cmake -S cpp -B cpp/build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPGLICHT_SANITIZER=${{ matrix.sanitizer }} \
            ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}
          grep -E '^CMAKE_CXX_COMPILER:' cpp/build/CMakeCache.txt
          cmake --build cpp/build --target pg_licht_mcp_test

      # Neither needs a database nor varies by PostgreSQL version, so they run
      # once here rather than twenty times downstream. protocol_compat pins the
      # response-shape contract -- which client gets a text block, and what the
      # two environment switches do -- end to end against the real binary,
      # because both switches are read once per process and cannot be toggled
      # from inside the gtest suite.
      - name: Lint the man page, check the response-shape contract, build the site
        if: matrix.sanitizer == 'NONE'
        working-directory: cpp/build
        run: |
          cmake --build . --target pg_licht_mcp
          ctest -R "manpage_lint|protocol_compat|llms_txt|reference|cli_" --output-on-failure

      - uses: actions/upload-artifact@v4
        if: matrix.config != 'plain-clang'
        with:
          name: test-binary-${{ matrix.config }}
          path: cpp/build/pg_licht_mcp_test
          retention-days: 1
          if-no-files-found: error

  sanitize:
    name: ${{ matrix.sanitizer }}-pg${{ matrix.pg }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
        sanitizer: [address-undefined, thread]

    steps:
      # The suite reads cpp/test/connections.example.ini through a path baked
      # in at compile time, so the source tree has to be present even though
      # nothing here is compiled.
      #
      # These jobs talk to the stock postgres:NN image, which carries contrib
      # and nothing else, and preloads nothing. The step below installs hypopg
      # and the three shared-memory extensions into it and preloads them with
      # pg_stat_statements, so the code behind evaluateIndex, the queryid path
      # and the four preload-backed tools runs under the sanitizers too rather
      # than being skipped. Their pooling behaviour is still the pooled job's.
      - uses: actions/checkout@v4

      - name: Preload the extensions in the service container
        run: .github/scripts/prepare-service-postgres.sh ${{ job.services.postgres.id }}

      - name: Install runtime dependencies
        run: .github/scripts/apt-pgdg.sh libpq5

      - uses: actions/download-artifact@v4
        with:
          name: test-binary-${{ matrix.sanitizer }}
          path: cpp/build

      - name: Run tests
        working-directory: cpp/build
        env:
          DATABASE_URL: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
          ASAN_OPTIONS: detect_leaks=1
          # Installed above on purpose, so a skip would mean something broke.
          PGLICHT_REQUIRE_HYPOPG: "1"
          PGLICHT_REQUIRE_PRELOAD_EXTENSIONS: "1"
        run: |
          chmod +x pg_licht_mcp_test   # artifacts do not preserve the mode bit
          ./pg_licht_mcp_test

  valgrind:
    name: valgrind-pg${{ matrix.pg }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # As in the sanitizer jobs: without it the extension-backed code is
      # skipped rather than checked for leaks.
      - name: Preload the extensions in the service container
        run: .github/scripts/prepare-service-postgres.sh ${{ job.services.postgres.id }}

      - name: Install runtime dependencies
        run: .github/scripts/apt-pgdg.sh libpq5 valgrind

      - uses: actions/download-artifact@v4
        with:
          name: test-binary-plain
          path: cpp/build

      # The same invocation pglicht_add_valgrind_test() registers in
      # cpp/cmake/SafetyFlags.cmake. Spelled out here because the build tree
      # ctest needs is not carried across jobs; keep the two in step.
      - name: Run tests under Valgrind
        working-directory: cpp/build
        env:
          DATABASE_URL: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
          PGLICHT_REQUIRE_HYPOPG: "1"
          PGLICHT_REQUIRE_PRELOAD_EXTENSIONS: "1"
        run: |
          chmod +x pg_licht_mcp_test
          valgrind --error-exitcode=99 --leak-check=full --track-origins=yes \
            ./pg_licht_mcp_test

  # Runs the full suite directly and then through a companion PgBouncer in
  # transaction mode (server_reset_query=DISCARD ALL) -- the deployment a
  # session-scoped read-only guard silently fails on. The script provisions its
  # own throwaway cluster, a streaming standby and a pooler, so no service
  # container is used here. The service-container jobs above preload the same
  # extensions, so what is left only here is what needs a pooler, a standby or
  # a subscriber.
  pooled:
    name: pooled-pg${{ matrix.pg }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        # postgresql-${{ matrix.pg }} brings initdb/pg_ctl/pg_basebackup and the
        # bundled contrib extensions (pg_stat_statements, postgres_fdw,
        # pgstattuple, pg_buffercache) the fixtures install; pgbouncer is the
        # companion pooler.
        #
        # hypopg is third-party rather than contrib, and it is installed only
        # here. That is deliberate: this is the one job that runs behind a
        # transaction-mode pooler, and the pooler is the only place the
        # evaluateIndex reset bracket can be proved. A hypothetical index
        # survives ROLLBACK, a new transaction and DISCARD ALL -- which is what
        # PgBouncer issues as server_reset_query -- so without the reset one
        # caller's hypothetical index reshapes the next caller's plans. The
        # test for that passes vacuously on a direct connection.
        # One line on purpose: this is a plain scalar, where a trailing
        # backslash is not a continuation -- YAML folds the lines with a space
        # and the backslash reaches the shell as an argument.
        #
        # pg_wait_sampling, pg_stat_kcache and pg_qualstats are third-party
        # too, and need shared_preload_libraries, which only this job's own
        # cluster sets -- the rig preloads each one it finds installed.
        run: .github/scripts/apt-pgdg.sh libpq5 postgresql-${{ matrix.pg }} postgresql-${{ matrix.pg }}-hypopg postgresql-${{ matrix.pg }}-pg-wait-sampling postgresql-${{ matrix.pg }}-pg-stat-kcache postgresql-${{ matrix.pg }}-pg-qualstats pgbouncer

      - uses: actions/download-artifact@v4
        with:
          name: test-binary-plain
          path: cpp/build

      - name: Run suite directly and through the pooler
        env:
          # Pin the cluster to the matrix version rather than letting the script
          # autodetect the newest one the runner happens to have installed.
          PG_BINDIR: /usr/lib/postgresql/${{ matrix.pg }}/bin
          # The hypopg tests skip themselves when the extension is absent, which
          # is right for a developer machine and wrong here: this job installs
          # it, so a skip means something broke rather than something is
          # missing. Turn the skip into a failure.
          PGLICHT_REQUIRE_HYPOPG: "1"
          # Same reasoning for the three preload extensions installed above.
          PGLICHT_REQUIRE_PRELOAD_EXTENSIONS: "1"
        run: |
          chmod +x cpp/build/pg_licht_mcp_test
          cpp/test/run-pooled-tests.sh
