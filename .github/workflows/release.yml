name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# A follow-up push supersedes the previous run of the same ref. Only
# pull_request runs are cancelled: a tag run publishes the release and its
# assets, so it must always be allowed to finish.
# Least privilege for every job that does not say otherwise: checkout needs to
# read the repository, and artifacts and caches use the runner's own token,
# not GITHUB_TOKEN. A job-level block replaces this one entirely, which is how
# the jobs that publish get more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so every Linux target links the same libpqxx, built statically from
  # source, instead of whatever version each distro happens to package.
  # libpq stays dynamic (its C ABI is stable across versions; distros patch
  # it independently), so it's still installed from each distro's own repo.
  PQXX_VERSION: 8.0.2

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    # A hung apt or network step would otherwise sit until the six-hour default.
    timeout-minutes: 40
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pg_licht_mcp-linux-x86_64
            distro: ubuntu
            extension: tar.gz
          - os: ubuntu-24.04-arm
            artifact: pg_licht_mcp-linux-arm64
            distro: ubuntu
            extension: tar.gz
          - os: ubuntu-latest
            container: debian:trixie
            artifact: pg_licht_mcp-linux-x86_64-debian13
            distro: debian
            extension: deb
          - os: ubuntu-24.04-arm
            container: debian:trixie
            artifact: pg_licht_mcp-linux-arm64-debian13
            distro: debian
            extension: deb
          - os: ubuntu-latest
            # Rocky's own image. The Docker Hub library image rockylinux:9 stopped at
            # 9.3, and since pgdg-redhat-repo 42.0-70 (2026-09-27) PGDG builds its
            # URLs from the minor release, rhel-9.3-* included, which it no longer
            # serves: every Rocky job failed on a 404 for pgdg18's repomd.xml.
            container: rockylinux/rockylinux:9
            artifact: pg_licht_mcp-linux-x86_64-rocky9
            distro: rocky
            extension: rpm
          - os: ubuntu-24.04-arm
            container: rockylinux/rockylinux:9
            artifact: pg_licht_mcp-linux-arm64-rocky9
            distro: rocky
            extension: rpm
          - os: macos-latest
            artifact: pg_licht_mcp-macos-arm64
            distro: macos
            extension: tar.gz

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          sudo apt-get install -y curl ca-certificates lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y cmake libpq-dev nlohmann-json3-dev pkg-config
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/libpqxx-build -j"$(nproc)"
          sudo cmake --install /tmp/libpqxx-build
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update -q
          # file is what CPack uses to find the ELF binaries it hands to
          # dpkg-shlibdeps, which derives the .deb's Depends.
          apt-get install -y curl ca-certificates gnupg lsb-release cmake build-essential pkg-config dpkg-dev file
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update -q
          apt-get install -y libpq-dev nlohmann-json3-dev python3
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/libpqxx-build -j"$(nproc)"
          cmake --install /tmp/libpqxx-build
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (Rocky Linux)
        if: matrix.distro == 'rocky'
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-$(uname -m)/pgdg-redhat-repo-latest.noarch.rpm
          dnf module disable -y postgresql
          # Rocky 9's default gcc-c++ is GCC 11, which lacks full <format>
          # support (needed by libpqxx 8.x's C++20 requirement; complete only
          # since GCC 13). gcc-toolset-13 is Rocky's own AppStream package
          # for a newer GCC without replacing the system compiler.
          #
          # PGDG's "libpq-devel" virtual package on RHEL/Rocky resolves to
          # the *versioned* postgresql18-devel, which installs libpq.pc to
          # /usr/pgsql-18/lib/pkgconfig -- never on pkg-config's default
          # search path. libpq5-devel is PGDG's separate, unversioned
          # package (same naming as its Debian/Ubuntu counterpart) that
          # installs to the standard FHS pkgconfig location instead.
          dnf install -y cmake gcc-toolset-13-gcc-c++ binutils libpq5-devel nlohmann-json-devel pkg-config rpm-build
          echo "CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc" >> $GITHUB_ENV
          echo "CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++" >> $GITHUB_ENV
          export CC=/opt/rh/gcc-toolset-13/root/usr/bin/gcc
          export CXX=/opt/rh/gcc-toolset-13/root/usr/bin/g++
          curl -fsSL "https://github.com/jtv/libpqxx/archive/refs/tags/${PQXX_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/libpqxx-${PQXX_VERSION}" -B /tmp/libpqxx-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSKIP_BUILD_TEST=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/libpqxx-build -j"$(nproc)"
          cmake --install /tmp/libpqxx-build
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install dependencies (macOS)
        if: matrix.distro == 'macos'
        run: |
          brew install cmake libpq libpqxx nlohmann-json pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Build
        run: |
          # -Werror explicitly: the packages ship from these toolchains, and
          # a warning here is one to fix before release, not to ship past.
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DPGLICHT_WERROR=ON
          cmake --build cpp/build --target pg_licht_mcp
          strip cpp/build/pg_licht_mcp

      # The hardening SafetyFlags.cmake asks for, checked on the binary that
      # ships -- after strip, which must not take any of it away. The release
      # build has no tests, so this is the one place it is checked on every
      # toolchain in the matrix. ELF only: macOS has no readelf.
      - name: Check the binary's hardening
        if: matrix.distro != 'macos'
        run: cpp/test/hardening-check.sh cpp/build/pg_licht_mcp

      - name: Package (tar.gz)
        if: matrix.extension == 'tar.gz'
        env:
          # BSD tar on macOS otherwise stores AppleDouble (._*) sidecars for
          # extended attributes, which show up as junk on extraction.
          COPYFILE_DISABLE: "1"
        run: |
          rm -rf stage
          # Stage through the install rules rather than tarring the build tree,
          # so the archive carries the same bin/ + share/man/ layout the .deb,
          # .rpm, and Homebrew keg get. The binary was already stripped above,
          # and `cmake --install` needs no target beyond pg_licht_mcp.
          cmake --install cpp/build --prefix "$PWD/stage"
          tar -czf ${{ matrix.artifact }}.tar.gz -C stage bin share
          tar -tzf ${{ matrix.artifact }}.tar.gz | sort
          test -f stage/share/man/man1/pg_licht_mcp.1

      - name: Package (deb)
        if: matrix.extension == 'deb'
        run: |
          cd cpp/build && cpack -G DEB
          # github.workspace is the host runner's path; this step runs inside
          # a container where the workspace is mounted elsewhere (/__w/...),
          # so a relative path is used instead of the host path.
          mv pg-licht-*.deb ../../${{ matrix.artifact }}.deb

      - name: Package (rpm)
        if: matrix.extension == 'rpm'
        run: |
          cd cpp/build && cpack -G RPM
          mv pg-licht-*.rpm ../../${{ matrix.artifact }}.rpm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.extension }}

  # Four of the seven release assets are packages, and until 4.3.0 none of
  # them was ever opened: the tarball was listed, the .deb and .rpm were
  # uploaded unexamined. A listing would not be enough either -- it shows a
  # Depends line and cannot say whether that line resolves. So each package is
  # INSTALLED in a fresh container of the distribution it targets, the way
  # INSTALL.md tells a user to, and the binary is run once.
  #
  # The two package types are checked against different rules, on purpose:
  #   .deb  plain Debian, no postgresql.org repository. Its Depends is derived
  #         by dpkg-shlibdeps from what the binary links, and Debian's own
  #         libpq5 satisfies it; a pass here proves no false dependency crept in.
  #   .rpm  Rocky Linux with PGDG enabled first, as INSTALL.md says. Its
  #         Requires names PGDG's libpq5 deliberately, and the check asserts the
  #         package that satisfied it is PGDG's, not the distribution's libpq.
  verify-packages:
    name: Install (${{ matrix.artifact }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: debian:trixie
            artifact: pg_licht_mcp-linux-x86_64-debian13
            extension: deb
          - os: ubuntu-24.04-arm
            container: debian:trixie
            artifact: pg_licht_mcp-linux-arm64-debian13
            extension: deb
          - os: ubuntu-latest
            container: rockylinux/rockylinux:9
            artifact: pg_licht_mcp-linux-x86_64-rocky9
            extension: rpm
          - os: ubuntu-24.04-arm
            container: rockylinux/rockylinux:9
            artifact: pg_licht_mcp-linux-arm64-rocky9
            extension: rpm

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}

      - name: Install the .deb on plain Debian (no postgresql.org repository)
        if: matrix.extension == 'deb'
        run: |
          set -eux
          pkg=./${{ matrix.artifact }}.deb
          depends=$(dpkg-deb -f "$pkg" Depends)
          echo "Depends: $depends"
          # Derived by dpkg-shlibdeps, so every library carries a minimum
          # version and the C++ runtime is named. A bare "libpq5" means the
          # derivation did not run and the hand-written line came back.
          echo "$depends" | grep -q 'libpq5 (>='
          echo "$depends" | grep -q 'libstdc++6 (>='
          apt-get update
          apt-get install -y "$pkg"
          # Nothing configured the postgresql.org repository, so whatever
          # satisfied libpq5 is Debian's own. Asserted rather than assumed.
          libpq_version=$(dpkg-query -W -f='${Version}' libpq5)
          echo "libpq5 $libpq_version"
          if echo "$libpq_version" | grep -q pgdg; then
            echo "libpq5 came from the postgresql.org repository on plain Debian" >&2
            exit 1
          fi
          pg_licht_mcp --help
          # The package says one version and the binary inside it another only
          # when something was packaged that was not just built; on a tag,
          # both must also be the tag.
          pkg_version=$(dpkg-deb -f "$pkg" Version)
          bin_version=$(pg_licht_mcp --version)
          echo "package $pkg_version, binary: $bin_version"
          [ "$bin_version" = "pg_licht_mcp ${pkg_version%%-*}" ]
          case "$GITHUB_REF" in refs/tags/v*) [ "v${pkg_version%%-*}" = "$GITHUB_REF_NAME" ] ;; esac
          ls /usr/share/man/man1/pg_licht_mcp.1*
          dpkg -L pg-licht

      - name: Install the .rpm on Rocky Linux with PGDG, as INSTALL.md says
        if: matrix.extension == 'rpm'
        run: |
          set -eux
          pkg=./${{ matrix.artifact }}.rpm
          rpm -qpR "$pkg"
          # PGDG's package by name, never the distribution's libpq.
          rpm -qpR "$pkg" | grep -qx 'libpq5'
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-$(uname -m)/pgdg-redhat-repo-latest.noarch.rpm
          # Rocky's own image sets tsflags=nodocs, which a real install does
          # not; without this the man page check below fails on a package
          # that ships it.
          dnf install -y --setopt=tsflags= "$pkg"
          provider=$(rpm -q --whatprovides libpq5)
          echo "libpq5 provided by: $provider"
          echo "$provider" | grep -q PGDG
          pg_licht_mcp --help
          # As for the .deb: package, binary and (on a tag) the tag agree.
          pkg_version=$(rpm -qp --qf '%{VERSION}' "$pkg")
          bin_version=$(pg_licht_mcp --version)
          echo "package $pkg_version, binary: $bin_version"
          [ "$bin_version" = "pg_licht_mcp $pkg_version" ]
          case "$GITHUB_REF" in refs/tags/v*) [ "v$pkg_version" = "$GITHUB_REF_NAME" ] ;; esac
          # rpmbuild may compress man pages, hence the glob.
          ls /usr/share/man/man1/pg_licht_mcp.1*
          rpm -ql pg-licht

  # The Homebrew formula lives in another repository and is only rewritten
  # after a release exists, so until 4.6 nothing built through it before the
  # tag: the macOS job above installs the same dependencies but runs cmake
  # itself, with its own flags. This job takes the tap's real formula, points
  # it at a tarball of this commit, and lets brew build it from source -- so a
  # change that breaks `brew install` (a flag Homebrew's compiler shim
  # rejects, a file the install rules miss, a warning that is only an error
  # outside a git checkout) fails the pull request, not the user.
  homebrew:
    name: Build through the Homebrew formula
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Point the tap's formula at this commit
        run: |
          # The same shape as the tag tarball the formula normally downloads:
          # one top-level directory, and no .git -- which is what turns
          # PGLICHT_WERROR off, as it is for a user.
          git archive --format=tar.gz --prefix=pg_licht-ci/ -o "$RUNNER_TEMP/pg_licht-ci.tar.gz" HEAD
          sha=$(shasum -a 256 "$RUNNER_TEMP/pg_licht-ci.tar.gz" | cut -d' ' -f1)
          brew tap-new --no-git pglicht/ci
          formula="$(brew --repository pglicht/ci)/Formula/pg-licht.rb"
          curl -fsSL -o "$formula" \
            https://raw.githubusercontent.com/sqlambda/homebrew-pg-licht/HEAD/Formula/pg-licht.rb
          # Only the source changes; everything brew does with it is the tap's.
          sed -i '' -E \
            -e "s|^  url \".*\"|  url \"file://$RUNNER_TEMP/pg_licht-ci.tar.gz\"\\
            version \"0.0.0-ci\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" "$formula"
          grep -q "file://$RUNNER_TEMP/pg_licht-ci.tar.gz" "$formula"
          grep -q "$sha" "$formula"
          cat "$formula"

      - name: brew install --build-from-source
        run: brew install --build-from-source --verbose pglicht/ci/pg-licht

      - name: Run what was installed
        run: |
          brew test pglicht/ci/pg-licht
          want=$(sed -nE 's/^project\(.* VERSION ([0-9.]+).*/\1/p' cpp/CMakeLists.txt)
          got=$("$(brew --prefix)/bin/pg_licht_mcp" --version)
          echo "$got"
          [ "$got" = "pg_licht_mcp $want" ]
          test -f "$(brew --prefix)/share/man/man1/pg_licht_mcp.1"

  release:
    name: Create release and update Homebrew formula
    # A package that does not install blocks the release rather than shipping.
    needs: [build, verify-packages, homebrew]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token and attestations are what the provenance step needs: the first
    # lets the job prove to Sigstore which workflow run it is, the second lets
    # it store the signed statement on this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      # A signed statement, per asset, that this file was built by this
      # workflow, from this commit, on a GitHub-hosted runner. It is what lets
      # a user tell a release asset from a file somebody else uploaded under
      # the same name:
      #   gh attestation verify <file> --repo sqlambda/pg_licht
      # Before the release is created, so that no asset is ever published
      # without one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pg_licht_mcp-*.tar.gz
            pg_licht_mcp-*.deb
            pg_licht_mcp-*.rpm

      # One file a user can check every download against without the GitHub
      # CLI: sha256sum -c --ignore-missing SHA256SUMS. The source tarball is
      # in it too, under the name GitHub serves it by; it exists as soon as
      # the tag does.
      - name: Write SHA256SUMS
        run: |
          sha256sum pg_licht_mcp-*.tar.gz pg_licht_mcp-*.deb pg_licht_mcp-*.rpm > SHA256SUMS
          src=$(curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "$src  ${{ github.ref_name }}.tar.gz" >> SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 8
          cat SHA256SUMS

      - name: Create GitHub release
        run: |
          # Idempotent, so re-running this job after a later step fails does not
          # dead-end here. `gh release create` errors with "a release with the
          # same tag name already exists", which aborts the job before the
          # Homebrew step it was re-run to reach -- the release is made once,
          # every step after it is not, and only the retry path notices.
          if gh release view "${{ github.ref_name }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} exists; refreshing its assets."
            gh release upload "${{ github.ref_name }}" \
              --repo ${{ github.repository }} \
              --clobber \
              pg_licht_mcp-linux-x86_64.tar.gz \
              pg_licht_mcp-linux-arm64.tar.gz \
              pg_licht_mcp-linux-x86_64-debian13.deb \
              pg_licht_mcp-linux-arm64-debian13.deb \
              pg_licht_mcp-linux-x86_64-rocky9.rpm \
              pg_licht_mcp-linux-arm64-rocky9.rpm \
              pg_licht_mcp-macos-arm64.tar.gz \
              SHA256SUMS
            exit 0
          fi
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "pg_licht_mcp ${{ github.ref_name }}" \
            --generate-notes \
            pg_licht_mcp-linux-x86_64.tar.gz \
            pg_licht_mcp-linux-arm64.tar.gz \
            pg_licht_mcp-linux-x86_64-debian13.deb \
            pg_licht_mcp-linux-arm64-debian13.deb \
            pg_licht_mcp-linux-x86_64-rocky9.rpm \
            pg_licht_mcp-linux-arm64-rocky9.rpm \
            pg_licht_mcp-macos-arm64.tar.gz \
            SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compute source tarball SHA256
        id: sha
        run: |
          SHA=$(curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: sqlambda/homebrew-pg-licht
        run: |
          # A dead token reaches git as an empty or rejected credential, and git
          # reports it as "Password authentication is not supported" -- which
          # reads like the workflow tried to send a password, and sends whoever
          # is debugging it after the wrong problem entirely. Diagnose it here
          # instead, before anything is cloned or pushed.
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set on this repository." \
                 "Create a fine-grained PAT scoped to ${TAP_REPO} with" \
                 "Contents: Read and write, then: gh secret set HOMEBREW_TAP_TOKEN"
            exit 1
          fi
          if ! curl -sf -o /dev/null -H "Authorization: Bearer ${TAP_TOKEN}" \
                 "https://api.github.com/repos/${TAP_REPO}"; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot read ${TAP_REPO} -- it is" \
                 "expired, revoked, or not scoped to that repository." \
                 "Fine-grained PATs default to a 30-day expiry; mint a new one" \
                 "with Contents: Read and write and re-run this job."
            exit 1
          fi

          # The tap is public, so the clone needs no credential. Keeping the
          # token out of the clone URL also keeps it out of the checkout's
          # .git/config, where any later `git remote -v` would print it.
          git clone --depth 1 "https://github.com/${TAP_REPO}.git" tap
          cd tap
          sed -i "s|refs/tags/v[^/]*.tar.gz|refs/tags/${{ github.ref_name }}.tar.gz|" Formula/pg-licht.rb
          sed -i "s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"${{ steps.sha.outputs.sha256 }}\"/" Formula/pg-licht.rb
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/pg-licht.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${{ github.ref_name }}; nothing to push."
            exit 0
          fi
          git commit -m "Update pg-licht to ${{ github.ref_name }}"
          # Credential supplied per-invocation rather than stored in the remote,
          # so it lives only in this process and not on the runner's disk.
          git push "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" \
                   "HEAD:$(git rev-parse --abbrev-ref HEAD)"

  # The site: a landing page, the man page rendered to HTML, and llms.txt.
  # llms.txt (https://llmstxt.org) is found by URL path, so it needs a site to
  # live under; a copy in the repository would be found by nothing.
  #
  # Built on every run, so a broken generator or a tool with no man page entry
  # fails a pull request rather than a tag. Deployed only by deploy-site, and
  # only for a release tag after the release itself succeeded, so the site
  # always describes a version that exists.
  site:
    name: Site and llms.txt
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The shipped Linux binary, not a rebuild: llms.txt is generated from
      # what the release actually contains.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pg_licht_mcp-linux-x86_64

      - name: Generate
        env:
          # A tag's own README and CHANGES for a release; main otherwise.
          REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y mandoc libpq5
          mkdir -p stage _site
          tar -xzf pg_licht_mcp-linux-x86_64.tar.gz -C stage
          mandoc -T html cpp/man/pg_licht_mcp.1 > _site/pg_licht_mcp.1.html
          # The reference, one page per tool and prompt, and the landing page
          # filled in from the same binary. Fails if a mocked example no longer
          # matches its tool's schema or a tool has no man page category.
          python3 tools/gen-reference.py --binary stage/bin/pg_licht_mcp \
            --out _site/reference --landing site/index.html --landing-out _site/index.html
          # Fails if any tool or prompt lacks a man page anchor to link to.
          python3 tools/generate-llms-txt.py --binary stage/bin/pg_licht_mcp \
            --man-html _site/pg_licht_mcp.1.html --ref "$REF" --output _site/llms.txt
          # Served as-is: no Jekyll pass over the generated files.
          touch _site/.nojekyll
          head -3 _site/llms.txt
          ls -la _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy-site:
    name: Publish the site
    needs: [site, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
