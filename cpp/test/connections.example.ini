; Example connections file for pg-licht.
;
; chmod 600 this file: pg-licht refuses one that is group- or world-readable,
; on the same reasoning as ~/.pgpass.
;
; Three topology keys say how the databases relate. Only the first two license
; a conclusion; a group implies nothing, which is the point.

; Capacity of one postmaster, declared once and inherited by its databases.
; Not a connection: it never appears in listConnections and never becomes the
; default. An explicit per-connection value still wins.
[instance:pg-prod-01]
host_ram_mb  = 65536
host_vcpus   = 16
host_storage = local nvme

[instance:pg-prod-02]
host_ram_mb  = 16384
host_vcpus   = 4
host_note    = read replica, smaller box on purpose

; Two databases on one postmaster: they share shared_buffers, WAL, autovacuum
; workers and disk, so one's checkpoint storm really is the other's latency.
[app_prod]
service           = app-prod
instance          = pg-prod-01
replication_group = app-ha
group             = prod, app

; statement_timeout_ms is the ceiling on any one call, 120000 by default.
; Raised here because a deliberate `tableBloat exact:true` on this database is
; a pgstattuple scan of the whole table, which is the point of the call rather
; than a runaway. 0 removes the ceiling entirely.
[billing_prod]
service              = billing-prod
instance             = pg-prod-01
replication_group    = billing-ha
group                = prod, billing
statement_timeout_ms = 600000

; A replica of app_prod: the same data on a different server, keeping its own
; statistics counters. duplicateIndexes and indexBloat report idx_scan, so an
; index dead on the primary may be alive here -- and only here.
[app_ro]
service           = app-replica
instance          = pg-prod-02
replication_group = app-ha
group             = prod, app, reporting

; A group may span instances and replication groups. This is how an agent asks
; "how are our dev servers today?" without knowing any connection name.
; Lowered instead: a dev box reached over a WAN link should give up quickly
; rather than tie up a backend while someone browses the catalog.
[app_dev]
host                 = dev-db
port                 = 5432
dbname               = app
group                = dev, app
statement_timeout_ms = 15000

[billing_dev]
host    = dev-db
port    = 5432
dbname  = billing
group   = dev, billing
; No instance declared for these two: sharing a host *and* port, they are
; inferred into one, reported as "inferred" rather than "declared". Behind a
; pooler one endpoint can front several instances, so an inferred instance
; groups output without licensing a claim about shared memory. verifyTopology
; settles it.
