; budgets.ini -- limits pg_licht applies to itself.
;
; Optional. Read from $PG_LICHT_BUDGETS, else budgets.ini beside the
; connections file in use, else ~/.config/pg_licht/budgets.ini. Without one,
; the values below are what apply. See "Budgets" in pg_licht_mcp(1).
;
; Must not be writable by anyone but its owner (chmod go-w): a limit another
; user can edit is a limit another user can raise. An unknown section or key,
; or a value out of range, stops the server at startup.

[analyze]
; explainQuery with analyze AND explicit settings executes the statement only
; if the worst case the plan's own memory limits permit -- each sort-like node
; at work_mem, each hash node at work_mem x hash_mem_multiplier, times the
; processes running it -- fits in this share of the connection's host_ram_mb.
; 1 to 100.
memory_percent   = 10

; ...and only if the plan asks for at most one parallel worker per this many
; of the connection's host_vcpus. 1 to 1024.
vcpus_per_worker = 4

; explainQuery with analyze refuses a statement whose plan calls a function
; PostgreSQL marks VOLATILE, since such a function may change the server in
; ways a read-only transaction does not prevent. That reads what a function
; declares, not what it does, and only you know your own functions. Both
; lists are schema.name, comma separated, and mean every function of that
; name whatever its parameters. Empty by default.
;
; Never analyzed, even though declared STABLE or IMMUTABLE:
;   forbidden_functions = audit.log_event, ops.kick_session
; Analyzed although VOLATILE, because they only read:
;   allowed_functions = app.current_tenant
; A name in both is forbidden.
forbidden_functions =
allowed_functions =

[payload]
; An answer larger than this many kilobytes is refused with {error, hint},
; the hint naming the arguments that make it smaller, instead of being
; returned. Set it just under what your client accepts, so an answer it
; would drop is refused with a way to ask for less instead. 0, the
; default, turns the guard off; at most 1048576.
max_kb = 0
